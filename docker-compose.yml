services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: calib
      POSTGRES_PASSWORD: calib
      POSTGRES_DB: calibration
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calib -d calibration"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_DATABASE_URL: postgresql+psycopg2://calib:calib@db:5432/calibration
      APP_DB_CONNECT_TIMEOUT: "60"
    ports:
      - "8000:8000"

volumes:
  pgdata:
